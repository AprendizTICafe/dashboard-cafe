{% extends 'base.html' %}{% block 'conteudo' %}<div class="container py-4"><nav aria-label="breadcrumb" class="mb-4"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{% url 'manutencao:advertencia' %}">Voltar</a></li><li class="breadcrumb-item active" aria-current="page">Nova Solicitação</li></ol></nav><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow border-0"><div class="card-header bg-primary text-white py-3"><h5 class="card-title m-0"><i class="bi bi-plus-circle me-2"></i>Nova Solicitação de Advertência</h5></div><div class="card-body p-4"><form method="POST" action="{% url 'manutencao:nova_advertencia' %}" enctype="multipart/form-data">{% csrf_token %}<div class="row g-3"><div class="col-md-8"><label class="form-label fw-bold text-secondary">Colaborador</label><div class="input-group"><span class="input-group-text bg-light"><i class="bi bi-person"></i></span><select name="colaborador" class="form-select" required><option value="" selected disabled>Selecione o funcionário...</option>{% for colaborador in colaboradores %}<option value="{{ colaborador.ColaboradorID }}">{{ colaborador.Name }}</option>{% endfor %}</select></div></div><div class="col-md-4"><label class="form-label fw-bold text-secondary">Data da Ocorrência</label><div class="input-group"><span class="input-group-text bg-light"><i class="bi bi-calendar-event"></i></span><input type="date" name="data_ocorrencia" class="form-control" required></div></div><div class="col-12"><label class="form-label fw-bold text-secondary">Motivo / Descrição Detalhada</label><textarea name="Descricao" class="form-control" rows="6" placeholder="Descreva detalhadamente o ocorrido..." required></textarea><div class="form-text">Forneça o máximo de detalhes para agilizar a análise do RH.</div></div><div class="col-12 mt-3"><label class="form-label fw-bold text-secondary d-flex justify-content-between">Anexos<span id="contadorArquivos" class="badge bg-info text-dark" style="display:none;">0 arquivos</span></label><input type="file" name="arquivos" class="form-control shadow-sm" id="inputArquivos" multiple accept=".jpg,.jpeg,.png,.pdf" required><div class="form-text">Máximo de 5 arquivos (10MB cada). Formatos: JPG, PNG, PDF.</div><ul id="listaArquivos" class="list-group list-group-flush mt-2 small"></ul><div id="fileError" class="text-danger small mt-2 fw-bold" style="display:none;"></div></div></div><hr class="my-4"><div class="d-flex justify-content-end gap-2"><a href="{% url 'manutencao:advertencia' %}" class="btn btn-light border px-4">Cancelar</a><button type="submit" class="btn btn-primary px-5 shadow-sm"><i class="bi bi-send me-2"></i>Enviar Solicitação</button></div></form></div></div></div></div>{% endblock %}
